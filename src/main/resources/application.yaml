server:
  error:
    include-message: always
  shutdown: graceful
spring:
  application:
    name: live-score-service
  datasource:
    url: jdbc:postgresql://localhost:5432/live_score
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:postgresql://localhost:5432/live_score
    user: postgres
    password: postgres
    baseline-version: 1.0

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  token:
    secret: 26452948404D6351655468576D5A7134743777217A25432A462D4A614E645267
    expired: 10800000

gcp:
  firebase:
    service-account: classpath:livescoresdu-firebase-adminsdk-6p6r9-e69205f00f.json

